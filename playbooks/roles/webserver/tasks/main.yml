---
- name: Deploy Nginx Configuration for Podman
  ansible.builtin.template:
    src: cmsfornerd.conf.j2
    dest: "{{ podman_cms_config_path }}/nginx/cmsfornerd.conf"
    owner: "{{ podman_cms_uid }}"
    group: "{{ podman_cms_gid }}"
    mode: '0600'

- name: Run Nginx Container
  containers.podman.podman_container:
    name: cmsfornerd-nginx
    image: docker.io/library/nginx:1.27
    state: started
    user: "{{ podman_cms_uid }}:{{ podman_cms_gid }}"
    restart_policy: always
    pod: "{{ podman_cms_pod_name }}"
    volumes:
      - "{{ podman_cms_config_path }}/nginx/cmsfornerd.conf:/etc/nginx/conf.d/default.conf:Z,ro"
      - "{{ cms_deploy_path }}:/var/www/html:Z"
      - "{{ podman_cms_logs_path }}/nginx:/var/log/nginx:Z"
    security_opt:
      - no-new-privileges
    cap_drop:
      - all
  become: true
  become_user: "{{ podman_cms_user }}"
