# Defaults for setup_os role
dsom_root: "/opt/cmsfornerd"
sovereign_owner: "dsom-admin"
dsom_group: "dsom-admin"
compiler_list:
  - /usr/bin/as
  - /usr/bin/gcc
  - /usr/bin/g++
  - /usr/bin/make

# OpenSCAP content version (pinned for reproducibility)
openscap_content_version: "0.1.75"
# IMPORTANT: Operator MUST populate this with the real sha256:<hexdigest> value for the pinned release.
# Obtain by downloading the release asset once and running `sha256sum` on it, or from the project's
# published checksums if available. Example format: "sha256:abc123def456..."
# Leave empty ("") to download without checksum verification (not recommended for production).
openscap_content_checksum: ""
