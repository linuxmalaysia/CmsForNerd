# Tasks to gather, extract, and write unified security audit reports
# capturing both Lynis hardening index and OpenSCAP compliance score.

- name: "Reporting | Capture Lynis Hardening Score"
  ansible.builtin.shell: |
    if [ -f /var/log/lynis-report.dat ]; then
      grep '^hardening_index=' /var/log/lynis-report.dat | cut -d= -f2
    else
      echo "N/A"
    fi
  register: reported_lynis_score
  changed_when: false
  ignore_errors: yes

- name: "Reporting | Parse OpenSCAP Compliance Score (Ubuntu)"
  ansible.builtin.shell: |
    if [ -f /opt/report/openscap/ssg-results-ubuntu2404.xml ]; then
      # Extracts the scoring value from evaluation results
      grep -oP '<score[^>]*>\K[^<]+' /opt/report/openscap/ssg-results-ubuntu2404.xml | head -n 1
    else
      echo "N/A"
    fi
  register: reported_openscap_score_ubuntu
  changed_when: false
  when: ansible_distribution == 'Ubuntu'
  ignore_errors: yes

- name: "Reporting | Parse OpenSCAP Compliance Score (RHEL/Alma)"
  ansible.builtin.shell: |
    if [ -f /opt/report/openscap/ssg-results-almalinux.xml ]; then
      grep -oP '<score[^>]*>\K[^<]+' /opt/report/openscap/ssg-results-almalinux.xml | head -n 1
    else
      echo "N/A"
    fi
  register: reported_openscap_score_rhel
  changed_when: false
  when: ansible_os_family == 'RedHat'
  ignore_errors: yes

- name: "Reporting | Template Unified Security Compliance Report"
  ansible.builtin.copy:
    content: |
      ---
      okf_version: 0.1
      type: report
      title: "Sovereign OS Security Hardening & Compliance Report"
      description: "Security audit and compliance report for {{ inventory_hostname }}"
      timestamp: "{{ lookup('pipe', 'date -u +\"%Y-%m-%dT%H:%M:%SZ\"') }}"
      ---
      # Sovereign OS Security Hardening & Compliance Report

      ## System Overview
      - **Target Host**: {{ inventory_hostname }}
      - **OS Distribution**: {{ ansible_distribution }} {{ ansible_distribution_version }}
      - **Kernel**: {{ ansible_kernel }}
      - **Report Timestamp**: {{ lookup('pipe', 'date "+%Y-%m-%d %H:%M:%S"') }}

      ## Hardening & Audit Scores
      - **Lynis Hardening Index**: {{ reported_lynis_score.stdout | default('N/A', true) }} / 100
      - **OpenSCAP CIS Level 2 Compliance Score**:
        {% if ansible_distribution == 'Ubuntu' %}
        {{ reported_openscap_score_ubuntu.stdout | default('N/A', true) }}%
        {% elif ansible_os_family == 'RedHat' %}
        {{ reported_openscap_score_rhel.stdout | default('N/A', true) }}%
        {% else %}
        N/A
        {% endif %}

      ## Executed Controls & Remediation
      - **Transparent Huge Pages (THP)**: Disabled
      - **SSH Server Hardening**: Configured (AllowTcpForwarding=no, MaxAuthTries=3, MaxSessions=2)
      - **Compiler Constraints**: Restrictive Root-Only Execution Applied
      - **Network Sysctl Tuning**: Kernel DDoS protections and BBR congestion control configured
      - **OpenSCAP Evaluation Status**:
        {% if ansible_distribution == 'Ubuntu' and openscap_ubuntu_status is defined %}
        {{ openscap_ubuntu_status }}
        {% elif ansible_os_family == 'RedHat' and openscap_rhel_status is defined %}
        {{ openscap_rhel_status }}
        {% else %}
        Not executed
        {% endif %}
      - **OpenSCAP Remediation Status**:
        {% if ansible_distribution == 'Ubuntu' and openscap_ubuntu_remediation_status is defined %}
        {{ openscap_ubuntu_remediation_status }}
        {% elif ansible_os_family == 'RedHat' and openscap_rhel_remediation_status is defined %}
        {{ openscap_rhel_remediation_status }}
        {% else %}
        Not executed
        {% endif %}
      - **OVAL Vulnerability Scan**:
        {% if ansible_distribution == 'Ubuntu' and oval_eval_status is defined %}
        {{ oval_eval_status }}
        {% else %}
        Not applicable for RedHat-family hosts
        {% endif %}

      ---
      *Deep State of Mind (DSOM) For My AI Protocol | Harisfazillah Jamel (LinuxMalaysia) | {{ lookup('pipe', 'date "+%Y-%m-%d"') }}*
    dest: "/opt/report/openscap/SECURITY_AUDIT_REPORT.md"
    mode: '0644'
  ignore_errors: yes
